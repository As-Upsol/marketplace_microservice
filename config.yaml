io:
  input:
    seller_file: "data/sellers.csv"
    buyer_file: "data/mainbuyer.csv"
    encoding: "utf-8"
    csv_options:
      delimiter: ","
      quotechar: '"'
      na_values: ["", "NA", "NaN", "N/A", "null", "None"]

  output:
    matches_file: "matches_output.csv"
    format: "csv"
    include_model_scores: true
    include_category_scores: true
    score_format: "percentage"
    decimal_places: 3
    column_order:
      - "Seller Name"
      - "Buyer Name"
      - "Overall Match Score"
      - "Sector Match"
      - "Sector Match: keyword"
      - "Sector Match: categorical"
      - "Sector Match: hierarchical"
      - "Sector Match: semantic"
      - "Offering Match"
      - "Offering Match: keyword"
      - "Offering Match: categorical"
      - "Offering Match: hierarchical"
      - "Offering Match: semantic"
      - "Customer Match"
      - "Customer Match: keyword"
      - "Customer Match: categorical"
      - "Customer Match: hierarchical"
      - "Customer Match: semantic"
      - "Geography Match"
      - "Geography Match: keyword"
      - "Geography Match: categorical"
      - "Geography Match: hierarchical"
      - "Geography Match: semantic"
      - "Size Match"
      - "Size Match: keyword"
      - "Size Match: categorical"
      - "Size Match: hierarchical"
      - "Size Match: semantic"
      - "Market Position Match"
      - "Market Position Match: keyword"
      - "Market Position Match: categorical"
      - "Market Position Match: hierarchical"
      - "Market Position Match: semantic"

models:
  sector_match:
    display_name: "Sector Match"
    weight: 0.25
    categories:
      - name: "keyword"
        type: "tfidf"
        strategy: "keyword_match"
        weight: 0.4
        fields:
          seller: ["industry_keywords", "company_description"]
          buyer: ["Keywords", "Industry Tags", "Short Description"]
      - name: "categorical"
        type: "exact_match"
        strategy: "exact_match"
        weight: 0.2
        fields:
          seller: []
          buyer: ["Primary Industry Code", "Primary Industry Sector"]
      - name: "hierarchical"
        type: "industry_similarity"
        strategy: "industry_similarity"
        weight: 0.3
        fields:
          seller: ["value_chain"]
          buyer: ["Value Chain"]
      - name: "semantic"
        type: "semantic"
        strategy: "spacy_similarity"
        weight: 0.1
        fields:
          seller: ["company_description"]
          buyer: ["Description"]

  offering_match:
    display_name: "Offering Match"
    weight: 0.20
    categories:
      - name: "keyword"
        type: "tfidf"
        strategy: "keyword_match"
        weight: 0.4
        fields:
          seller: ["products_and_services", "unique_selling_points"]
          buyer: ["Offering", "Problem Solved / Market Painpoint"]
      - name: "categorical"
        type: "exact_match"
        strategy: "exact_match"
        weight: 0.2
        fields:
          seller: ["revenue_model"]
          buyer: ["Business model"]
      - name: "hierarchical"
        type: "industry_similarity"
        strategy: "industry_similarity"
        weight: 0.2
        fields:
          seller: ["revenue_by_product_type"]
          buyer: ["Product/Service Features"]
      - name: "semantic"
        type: "semantic"
        strategy: "spacy_similarity"
        weight: 0.2
        fields:
          seller: ["products_and_services"]
          buyer: ["Core Value Proposition"]

  customer_match:
    display_name: "Customer Match"
    weight: 0.15
    categories:
      - name: "keyword"
        type: "tfidf"
        strategy: "keyword_match"
        weight: 0.3
        fields:
          seller: ["customer_industries"]
          buyer: ["Target Customers Description", "Target Customers Industries"]
      - name: "categorical"
        type: "exact_match"
        strategy: "exact_match"
        weight: 0.2
        fields:
          seller: ["target_customers"]
          buyer: ["Target Customers Type"]
      - name: "hierarchical"
        type: "industry_similarity"
        strategy: "industry_similarity"
        weight: 0.3
        fields:
          seller: ["customer_industries"]
          buyer: ["Target Customers Industries"]
      - name: "semantic"
        type: "semantic"
        strategy: "spacy_similarity"
        weight: 0.2
        fields:
          seller: ["company_description"]
          buyer: ["Target Customers Description"]

  geography_match:
    display_name: "Geography Match"
    weight: 0.10
    categories:
      - name: "keyword"
        type: "tfidf"
        strategy: "keyword_match"
        weight: 0.2
        fields:
          seller: ["Headquarters - Country/Region"]
          buyer: ["HQ Country", "HQ City"]
      - name: "categorical"
        type: "exact_match"
        strategy: "exact_match"
        weight: 0.4
        fields:
          seller: ["Headquarters - Country/Region"]
          buyer: ["HQ Country"]
      - name: "hierarchical"
        type: "industry_similarity"
        strategy: "industry_similarity"
        weight: 0.3
        fields:
          seller: ["revenue_by_geography"]
          buyer: ["HQ City"]
      - name: "semantic"
        type: "semantic"
        strategy: "spacy_similarity"
        weight: 0.1
        fields:
          seller: []
          buyer: []

  market_position_match:
    display_name: "Market Position Match"
    weight: 0.10
    categories:
      - name: "keyword"
        type: "tfidf"
        strategy: "keyword_match"
        weight: 0.4
        fields:
          seller: ["industry_keywords", "main_competitors"]
          buyer: ["Industry Tags", "Core Value Proposition"]
      - name: "categorical"
        type: "exact_match"
        strategy: "exact_match"
        weight: 0.2
        fields:
          seller: []
          buyer: []
      - name: "hierarchical"
        type: "industry_similarity"
        strategy: "industry_similarity"
        weight: 0.2
        fields:
          seller: []
          buyer: []
      - name: "semantic"
        type: "semantic"
        strategy: "spacy_similarity"
        weight: 0.2
        fields:
          seller: ["main_competitors"]
          buyer: ["Core Value Proposition"]

  size_match:
    display_name: "Size Match"
    weight: 0.10
    categories:
      - name: "keyword"
        type: "tfidf"
        strategy: "keyword_match"
        weight: 0.3
        fields:
          seller: ["company_size", "employee_count"]
          buyer: ["Target Company Size", "Target Employee Count"]
      - name: "categorical"
        type: "exact_match"
        strategy: "exact_match"
        weight: 0.3
        fields:
          seller: ["company_size"]
          buyer: ["Target Company Size"]
      - name: "hierarchical"
        type: "industry_similarity"
        strategy: "industry_similarity"
        weight: 0.2
        fields:
          seller: ["company_size"]
          buyer: ["Target Company Size"]
      - name: "semantic"
        type: "semantic"
        strategy: "spacy_similarity"
        weight: 0.2
        fields:
          seller: ["company_size"]
          buyer: ["Target Company Size"]


scaling:
  factor: 1.0
  range: [0, 100]

category_strategies:
  keyword_match:
    min_keyword_count: 2
    similarity_threshold: 0.6

  exact_match:
    match_threshold: 1.0

  industry_similarity:
    taxonomy_file: "data/industry_taxonomy.csv"
    max_depth: 3

  spacy_similarity:
    threshold: 0.7

  growth_stage_match:
    match_threshold: 0.8

field_aliases:
  seller:
    industry_keywords: ["sector_tags", "business_keywords"]
    naics_code: ["industry_classification"]

  buyer:
    industry_tags: ["sector_labels", "business_segments"]

preprocessing:
  text_cleaning:
    remove_punctuation: false
    lowercase: true
    remove_stopwords: false
    custom_regex:
      - pattern: "\\b(ltd|inc|llc|corp)\\b"
        replace_with: ""
    empty_field_handling:
      default_text: ""

  spacy:
    model: "en_core_web_sm"
    disabled_components: ["parser", "ner"]
